name: Build Lumi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: 下载项目
        uses: actions/checkout@v7

      - name: 安装 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 解压桌宠工程
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "找到项目：$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: 整理项目目录
        run: |
          if [ -f "project/settings.gradle.kts" ]; then
            echo "项目位于 project/"
          else
            PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
            echo "发现项目目录：$PROJECT_DIR"
            cp -r "$PROJECT_DIR"/* .
          fi

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: |
          gradle assembleDebug --no-daemon

      - name: 保存 APK
        uses: actions/upload-artifact@v7
        with:
          name: lumi-desktop-pet-apk
          path: app/build/outputs/apk/debug/*.apk
